<html lang="id">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Recap Chat — Pahami Percakapan WhatsApp Kamu</title>

    content="Recap Chat membantu kamu membaca ulang percakapan WhatsApp dengan rapi, jelas, dan mendalam. Analisis emosi, topik, dan timeline chat kamu secara instan." />
  <meta name="keywords" content="Recap Chat, analisis chat whatsapp, curhat anonim, chat summary, sentiment analysis" />
  <link rel="canonical" href="https://recapchat.xyz/" />

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            stone: {
              50: '#fafaf9',
              100: '#f5f5f4',
              200: '#e7e5e4',
              300: '#d6d3d1',
              400: '#a8a29e',
              500: '#78716c',
              600: '#57534e',
              700: '#44403c',
              800: '#292524',
              900: '#1c1917',
              950: '#0c0a09',
            },
            // New Specific Palette
            pastel: {
              bgStart: '#FFFDFB',
              bgEnd: '#F4F1FF',
              card: '#FFE5D9', // Peach soft
              primary: '#B8A9E6',
              primaryHover: '#A595E5',
              secondary: '#E9F7EF',
              secondaryText: '#4A6F63',
              lavender: '#E6D9FF',
              peach: '#FFE5D9',
              mint: '#E9F7EF',
              gray: '#F4F4F4',
              blue: '#E3F2FD',
              yellow: '#FFF9C4',
              // Dark Mode Variants
              darkCard: '#292524',
              darkBgStart: '#1c1917',
              darkBgEnd: '#0c0a09',
            },
            // Text Colors
            txt: {
              main: '#6B6B6B',
              sub: '#9A9A9A',
              quote: '#7A6FAE'
            },
            // Emotion Colors
            emo: {
              warm: '#FFD6A5',
              enthusiastic: '#FFCAD4',
              neutral: '#E0E0E0',
              sad: '#CDB4DB'
            }
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            heading: ['Nunito', 'sans-serif'],
          },
          backgroundImage: {
            'noise': "url('data:image/svg+xml,%3Csvg viewBox=%220 0 200 200%22 xmlns=%22http://www.w3.org/2000/svg%22%3E%3Cfilter id=%22noiseFilter%22%3E%3CfeTurbulence type=%22fractalNoise%22 baseFrequency=%220.65%22 numOctaves=%223%22 stitchTiles=%22stitch%22/%3E%3C/filter%3E%3Crect width=%22100%25%22 height=%22100%25%22 filter=%22url(%23noiseFilter)%22 opacity=%220.05%22/%3E%3C/svg%3E')",
          }
        }
      }
    }
  </script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap');
    @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap');

    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #FFFDFB 0%, #F4F1FF 100%);
      color: #6B6B6B;
      transition: background 0.3s ease, color 0.3s ease;
      min-height: 100vh;
    }

    h1,
    h2,
    h3,
    h4,
    button {
      font-family: 'Nunito', sans-serif;
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 8px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: #d6d3d1;
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #a8a29e;
    }

    /* Typing Cursor */
    .typing-cursor::after {
      content: '|';
      animation: blink 1s step-end infinite;
      font-weight: bold;
      color: #B8A9E6;
    }

    @keyframes blink {

      0%,
      100% {
        opacity: 1;
      }

      50% {
        opacity: 0;
      }
    }

    /* Markdown Styles inside Chat */
    .markdown-content p {
      margin-bottom: 0.75em;
    }

    .markdown-content p:last-child {
      margin-bottom: 0;
    }

    .markdown-content ul,
    .markdown-content ol {
      margin-bottom: 0.75em;
      padding-left: 1.25em;
    }

    .markdown-content li {
      margin-bottom: 0.25em;
    }

    /* Dark Mode Overrides */
    .dark body {
      background: linear-gradient(135deg, #0c0a09 0%, #1c1917 50%, #292524 100%);
      color: #e7e5e4;
    }

    .dark ::-webkit-scrollbar-thumb {
      background: #57534e;
    }

    .dark ::-webkit-scrollbar-thumb:hover {
      background: #78716c;
    }

    /* =====================================================
       PERFORMANCE: CSS Animations (replaces framer-motion infinite loops)
       GPU-composited: no JS thread involved
    ====================================================== */
    @keyframes blob-float-1 {
      0%, 100% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(50px, 30px) scale(1.2); }
    }
    @keyframes blob-float-2 {
      0%, 100% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(-30px, 50px) scale(1.1); }
    }
    @keyframes icon-float-1 {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      33% { transform: translateY(-25px) rotate(5deg); }
      66% { transform: translateY(-12px) rotate(-5deg); }
    }
    @keyframes icon-float-2 {
      0%, 100% { transform: translate(0, 0); }
      50% { transform: translate(10px, 15px); }
    }
    @keyframes icon-float-3 {
      0%, 100% { transform: translateY(0); opacity: 0.4; }
      50% { transform: translateY(-20px); opacity: 0.6; }
    }
    @keyframes icon-float-4 {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(30px) rotate(-10deg); }
    }
    @keyframes icon-float-5 {
      0%, 100% { transform: translate(0, 0); }
      50% { transform: translate(-5px, -15px); }
    }
    @keyframes icon-spin-slow {
      0% { transform: scale(1) rotate(0deg); }
      50% { transform: scale(1.2) rotate(180deg); }
      100% { transform: scale(1) rotate(360deg); }
    }
    @keyframes particle-float {
      0%, 100% { transform: translateY(0); opacity: 0; }
      50% { transform: translateY(-40px); opacity: 0.8; }
    }
    @keyframes typing-dot {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 1; }
    }
    @keyframes logo-glow-shift {
      0%, 100% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
    }

    .blob-float-1 { animation: blob-float-1 8s ease-in-out infinite; will-change: transform; }
    .blob-float-2 { animation: blob-float-2 10s ease-in-out infinite 1s; will-change: transform; }
    .icon-float-1 { animation: icon-float-1 5s ease-in-out infinite; will-change: transform; }
    .icon-float-2 { animation: icon-float-2 6s ease-in-out infinite 1s; will-change: transform; }
    .icon-float-3 { animation: icon-float-3 7s ease-in-out infinite 2s; will-change: transform, opacity; }
    .icon-float-4 { animation: icon-float-4 6s ease-in-out infinite 0.5s; will-change: transform; }
    .icon-float-5 { animation: icon-float-5 5s ease-in-out infinite 1.5s; will-change: transform; }
    .icon-spin-slow { animation: icon-spin-slow 12s linear infinite; will-change: transform; }
    .particle-float-0 { animation: particle-float 3s ease-in-out infinite; will-change: transform, opacity; }
    .particle-float-1 { animation: particle-float 4s ease-in-out infinite 0.8s; will-change: transform, opacity; }
    .particle-float-2 { animation: particle-float 3.5s ease-in-out infinite 1.6s; will-change: transform, opacity; }
    .particle-float-3 { animation: particle-float 5s ease-in-out infinite 0.3s; will-change: transform, opacity; }
    .particle-float-4 { animation: particle-float 4.5s ease-in-out infinite 1.2s; will-change: transform, opacity; }
    .typing-dot-1 { animation: typing-dot 1.2s ease-in-out infinite; }
    .typing-dot-2 { animation: typing-dot 1.2s ease-in-out infinite 0.2s; }
    .typing-dot-3 { animation: typing-dot 1.2s ease-in-out infinite 0.4s; }
    .logo-glow-css { background-size: 200% 200%; animation: logo-glow-shift 3s linear infinite; }
    .logo-glow-css-rev { background-size: 200% 200%; animation: logo-glow-shift 3s linear infinite reverse; }

    /* Reduce motion for users who prefer it */
    @media (prefers-reduced-motion: reduce) {
      .blob-float-1, .blob-float-2,
      .icon-float-1, .icon-float-2, .icon-float-3, .icon-float-4, .icon-float-5, .icon-spin-slow,
      .particle-float-0, .particle-float-1, .particle-float-2, .particle-float-3, .particle-float-4,
      .typing-dot-1, .typing-dot-2, .typing-dot-3,
      .logo-glow-css, .logo-glow-css-rev { animation: none; }
    }
  </style>

</script>
